<script>
window.addEventListener('load',()=>{setTimeout(()=>{
 const f=document.querySelector('iframe').contentDocument;
 const out=[];
 for(const sel of ['.sp-hero','.sp-figures','.mel-panel','.sp-products','.sp-curator','.fig:nth-child(1) .shot','.prod:nth-child(1) .shot','.prod:nth-child(2) .shot','.mel-lockup','.fig:nth-child(1) .ttl','.prod:nth-child(1) .ttl']){
   const e=f.querySelector(sel); if(!e){out.push(sel+' MISSING');continue}
   const r=e.getBoundingClientRect();
   out.push(sel+' x='+r.x.toFixed(1)+' y='+(r.y+f.defaultView.scrollY).toFixed(1)+' w='+r.width.toFixed(2)+' h='+r.height.toFixed(2));
 }
 document.title=JSON.stringify(out);
 document.body.textContent=out.join('\n');
},1500)});
</script>
<iframe src="http://localhost:8765/sponsors/sumii/" style="width:1440px;height:5000px;border:0"></iframe>
