:root{
  --white:#FFFFFF;
  --bg-grey:#EEF0EF;
  --ink:#1B1B1B;
  --max:1440px;
  --cop:"Copperplate","Noto Sans Arabic","Times New Roman",serif;
  --heb:"FbEzmel","Noto Sans Arabic","Arial Hebrew","David Libre",serif;
  --pad-x:96px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden}
body{background:var(--white);color:var(--ink);font-family:var(--cop);-webkit-font-smoothing:antialiased;overflow-x:visible;max-width:100vw}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}

/* GLOBAL CASING RULE — all English text renders UPPERCASE (project-wide).
   Hebrew is exempt. See CLAUDE.md §8.3 / conventions.md §5. */
body{text-transform:uppercase}
.heb,.heb *,[dir="rtl"],[dir="rtl"] *{text-transform:none;font-family:var(--heb)}

/* ===== HERO (upcoming events) — Figma desktop 1318:1754 (grey band) / mobile 1318:2033 (white) =====
   Figma title is 80px; our Copperplate runs ~28% wider → 64px optical match (lessons 2026-07-09). */
.hero{background:var(--bg-grey);padding:48px 112px 40px}
.hero-inner{width:100%;max-width:var(--max);margin:0 auto;text-align:right}
.hero h1{font-family:var(--cop);font-size:60px;line-height:.98;color:var(--ink);letter-spacing:.02em}
.hero h1 .hb{display:block;font-weight:700}
.hero h1 .hl{display:block;font-weight:300}

/* ===== EVENTS LIST — Figma grid 1318:1761 (2×2, gap 48, card 600×162.25) =====
   Cards render client-side from #events-list-data: past dates drop out on their own
   (same pattern as homepage #events-upcoming). Text column left, image right — per Figma. */
.ev-list{
  max-width:var(--max);margin:0 auto;
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  /* chronological order flows DOWN the right column first, then the left — same RTL column
     trick as /press/. Per Figma 1318:1761 (synced 2026-09-01, 8 cards / 4 rows):
     right col = sumii-opening 2.9 / the-space-between 3.9 / elsa 6.9 / baruch 6.9,
     left col  = maria 7.9 / nir-giorgio-levin-medina 8.9 / zohar-ron-medina 9.9 / jessica 10.9.
     NOTE 2026-08-28: amnon-lipkin was deleted from the site by request. The 8.9 slot is now
     nir-giorgio-levin-medina — a DIFFERENT event (imageRef 99781a55…, added 2026-09-01 by
     user decision); do NOT restore amnon-lipkin on the next sync.
     JS sets the exact row count (ceil(n/2)); repeat(3,auto) is only a no-JS fallback. */
  grid-auto-flow:column;direction:rtl;grid-template-rows:var(--ev-rows,repeat(3,auto));
  gap:48px;
  padding:48px var(--pad-x);background:var(--white);
}
.ev-card{display:flex;gap:16px;direction:ltr;min-width:0}
.ev-card .txt{
  flex:1 1 0;min-width:0;
  display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;
  text-align:right;
}
.ev-card .im{flex:1 1 0;min-width:0;aspect-ratio:292/162.25;overflow:hidden;background:#FAFAFA}
.ev-card .im img{width:100%;height:100%;object-fit:cover;transition:transform .7s ease}
.ev-card picture{display:contents}
.ev-card:hover .im img{transform:scale(1.04)}
/* tag chip — always two lines (event / gallery); font shrinks to fit; long names may wrap */
.ev-card .tag{
  background:var(--bg-grey);padding:4px 8px;
  font-family:var(--cop);font-weight:300;font-size:11.5px;line-height:1.35;letter-spacing:.02em;
  max-width:100%;width:max-content;box-sizing:border-box;
}
.ev-card .tag .t1,.ev-card .tag .t2{display:block;white-space:nowrap}
.ev-card .tag .sep{display:none}
.ev-card .tag.tag--wrap .t2{white-space:normal}
.ev-card .ttl{font-family:var(--cop);font-weight:400;font-size:13px;line-height:1.5;letter-spacing:.02em}
/* Hebrew card title — the designer words some cards in Hebrew instead of English
   (the-space-between: Figma 1318:3227 desktop / 1455:2573 mobile).
   Hebrew keeps Figma px verbatim (16 / 14); only Latin gets the optical calibration. */
.ev-card .ttl--he{font-family:var(--heb);font-weight:400;font-size:16px;line-height:1.35;letter-spacing:0;direction:rtl;text-transform:none}
.ev-card .date{font-family:var(--cop);font-weight:300;font-size:11.5px;line-height:1.2;letter-spacing:.02em}
.ev-card .date--tbd{font-family:var(--heb);font-weight:400;font-size:14px;direction:rtl;text-transform:none;letter-spacing:0}

/* `soon:true` in the mirror — event without a page yet: non-clickable + "בקרוב" toast
   (press/homepage precedent). No card uses it right now (zohar-ron-medina got its page
   on 2026-08-06); kept for the next event announced before its page exists. */
.ev-card--soon{cursor:default}
.ev-card--soon:hover .im img{transform:none}
.soon-toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:#fff;font-family:var(--heb);font-size:16px;font-weight:400;text-transform:none;padding:10px 28px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:300}
.soon-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* empty state — shown only when no upcoming events remain */
.ev-none{max-width:var(--max);margin:0 auto;padding:64px var(--pad-x);font-family:var(--heb);font-weight:400;font-size:18px;color:var(--ink);direction:rtl;text-align:right;text-transform:none}
.ev-none[hidden]{display:none}

/* ============================================================
   RESPONSIVE — TABLET (≤1100px) — stays 2-up
   ============================================================ */
@media (max-width:1100px){
  :root{--pad-x:48px}
  .hero{padding:48px 64px 40px}
  .hero h1{font-size:46px}
  .ev-list{gap:32px}
}

/* ============================================================
   RESPONSIVE — MOBILE (≤768px) — single column per Figma 1318:2012 (white hero)
   ============================================================ */
@media (max-width:768px){
  :root{--pad-x:16px}
  .hero{background:var(--white);padding:32px 16px 8px}
  .hero h1{font-size:27px;line-height:1.1}
  .ev-list{grid-template-columns:1fr;grid-auto-flow:row;direction:ltr;grid-template-rows:none;gap:24px;padding:24px 16px 32px}
  .ev-card .im{flex:0 0 171px;aspect-ratio:171/108}
  .ev-card .ttl--he{font-size:14px}
}

  var list=document.getElementById('events-list');
  var none=document.getElementById('events-none');
  var src=document.getElementById('events-list-data');
  if(!list||!src) return;
  var all; try{all=JSON.parse(src.textContent);}catch(e){return;}
  var GALLERY={medina:'kikar hamedina',dizengoff:'dizengoff square','flea-market':'flea market'};
  var n=new Date(), today=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
  var up=all.filter(function(e){
    if(e.date_tbd) return true;               // date TBD ("פרטים ותאריך בהמשך") — always upcoming
    if(e.pinned) return true;                 // still listed in the designer's frame (1318:1761/2012)
                                              // even though the date passed — drop the flag (here and
                                              // in data/events.json, and un-pin the /press/ card) when
                                              // she removes it from Figma
    var p=String(e.date).split('-');
    return new Date(+p[0],+p[1]-1,+p[2]).getTime()>=today;
  }).sort(function(a,b){
    if(a.date_tbd&&b.date_tbd) return 0;       // dated events first (ascending), TBD events last
    if(a.date_tbd) return 1;
    if(b.date_tbd) return -1;
    return a.date<b.date?-1:a.date>b.date?1:0;
  });
  if(!up.length){ if(none) none.hidden=false; return; }
  /* desktop reads down the right column first (RTL column flow) — exact row count per item total */
  list.style.setProperty('--ev-rows','repeat('+Math.ceil(up.length/2)+',auto)');
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  list.innerHTML=up.map(function(e,i){
    var dateHtml=e.date_tbd
      ? '<div class="date date--tbd">פרטים ותאריך בהמשך</div>'
      : (function(){var d=String(e.date).split('-');return '<div class="date">'+esc((+d[2])+'.'+(+d[1])+'.'+d[0])+'</div>';})();
    var load=i?' loading="lazy" decoding="async"':' fetchpriority="high" decoding="async"';
    /* optional `widths` — heavy card image that trips golden rule 12 (>=80KB and >=800px).
       Variants live beside the master as <name>-<w>w.webp (+ avif siblings, which
       picture-upgrade.js maps automatically). Cards without the field stay single-src. */
    var srcset='';
    if(e.widths&&e.widths.length){
      var base='../'+e.img.replace(/\.webp$/,'');
      srcset=' srcset="'+e.widths.map(function(w){
        return esc(w===e.w?base+'.webp':base+'-'+w+'w.webp')+' '+w+'w';
      }).join(', ')+'" sizes="(max-width:768px) 171px, 292px"';
    }
    return (e.soon?'<a class="ev-card ev-card--soon" href="#" role="link" aria-disabled="true">':'<a class="ev-card" href="'+esc(e.slug)+'/">')
      +'<div class="txt">'
      +'<div class="tag"><span class="t1">gallery event</span><span class="sep"> | </span><span class="t2">'+esc(GALLERY[e.gallery_id]||'')+'</span></div>'
      +(e.title_he
          ? '<div class="ttl ttl--he" dir="rtl">'+esc(e.title_he)+'</div>'
          : '<div class="ttl">'+esc(e.title_en)+'</div>')
      +dateHtml
      +'</div>'
      +'<div class="im"><img src="../'+esc(e.img)+'"'+srcset+' width="'+e.w+'" height="'+e.h+'" alt="'+esc(e.alt)+'"'+load+'></div>'
      +'</a>';
  }).join('');
  if(window.PictureUpgrade) PictureUpgrade.refresh(list);

  /* "בקרוב" toast — card for an event without a page yet (press/homepage precedent) */
  var soonCards=list.querySelectorAll('.ev-card--soon');
  if(soonCards.length){
    var toast=document.createElement('div');
    toast.className='soon-toast';
    toast.textContent='בקרוב';
    toast.setAttribute('role','status');
    document.body.appendChild(toast);
    var toastT;
    soonCards.forEach(function(c){
      c.addEventListener('click',function(ev){
        ev.preventDefault();
        toast.classList.add('show');
        clearTimeout(toastT);
        toastT=setTimeout(function(){toast.classList.remove('show')},1800);
      });
    });
  }

  /* Shrink tag font so line 1 + line 2 fit; allow extra wraps only for unusually long gallery names */
  function fitEventTags(){
    var MIN=8,MAX=11.5,LONG_T2=20;
    list.querySelectorAll('.ev-card .tag').forEach(function(tag){
      var t1=tag.querySelector('.t1'),t2=tag.querySelector('.t2');
      if(!t1||!t2) return;
      var avail=tag.parentElement.clientWidth;
      var t2len=(t2.textContent||'').trim().length;
      tag.classList.remove('tag--wrap');
      t1.style.whiteSpace='nowrap';
      t2.style.whiteSpace='nowrap';
      tag.style.fontSize=MAX+'px';
      tag.style.maxWidth=avail+'px';
      var px=MAX;
      while(px>MIN){
        tag.style.fontSize=px+'px';
        if(tag.scrollWidth<=avail) break;
        px-=0.5;
      }
      if(t2len>LONG_T2||(px<=MIN&&tag.scrollWidth>avail)){
        tag.classList.add('tag--wrap');
        t2.style.whiteSpace='normal';
      }
    });
  }
  fitEventTags();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitEventTags);
  var fitTimer;
  window.addEventListener('resize',function(){
    clearTimeout(fitTimer);
    fitTimer=setTimeout(fitEventTags,100);
  });
})();
</script>
