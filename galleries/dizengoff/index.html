@font-face{font-family:"Copperplate";src:url("../../פונטים/Copperplate.woff2") format("woff2"),url("../../פונטים/Copperplate.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Copperplate";src:url("../../פונטים/CopperplateCC-Bold.woff2") format("woff2"),url("../../פונטים/CopperplateCC-Bold.otf") format("opentype");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"FbEzmel";src:url("../../פונטים/FbEzmel-Light.woff2") format("woff2"),url("../../פונטים/FbEzmel-Light.otf") format("opentype");font-weight:300;font-style:normal;font-display:swap}

@font-face{font-family:"Noto Sans Arabic";src:url("../../פונטים/NotoSansArabic-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+08A0-08FF,U+200C-200D,U+FB50-FDFF,U+FE70-FEFF}

:root{
  --white:#FFFFFF;
  --bg-grey:#EEF0EF;
  --ink:#1B1B1B;
  --divider:#D8D8D8;
  --max:1248px;
  --cop:"Copperplate","Noto Sans Arabic","Times New Roman",serif;
  --heb:"FbEzmel","Noto Sans Arabic","Arial Hebrew","David Libre",serif;
  --sol:"Solway","Copperplate","Times New Roman",serif;
  --pad-x:96px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden}
body{background:var(--white);color:var(--ink);font-family:var(--cop);-webkit-font-smoothing:antialiased;overflow-x:visible;max-width:100vw}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;background:none;border:0;color:inherit}

/* GLOBAL CASING RULE — all English renders Copperplate UPPERCASE (conventions §5). Hebrew exempt. */
body{text-transform:uppercase}
.heb,.heb *,[dir="rtl"],[dir="rtl"] *{text-transform:none;font-family:var(--heb)}

/* square-dot separator (4×4 ink square, homepage address-row pattern) */
.sq{display:inline-block;width:4px;height:4px;background:var(--ink);flex:0 0 auto;font-style:normal}

/* ============================================================
   HERO — gallery name / address / hours + storefront photo
   (Figma desktop 1473:337: #EEF0EF band, padding 48/96/40, content
   right-aligned, photo 204.34×309 at the right; gap 48)
   ============================================================ */
.g-hero{background:var(--bg-grey);padding:48px var(--pad-x) 40px}
.g-hero__inner{max-width:var(--max);margin:0 auto;display:flex;justify-content:flex-end;align-items:center;gap:48px}
.g-hero__text{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:flex-end}
/* Hebrew title = Figma px verbatim (80) */
.g-hero__title{font-family:var(--heb);font-weight:400;font-size:80px;line-height:1.1;color:var(--ink);direction:rtl;text-align:right}
/* Address — Copperplate 28 Figma → 22px optical (our Copperplate runs ~28% wider) */
.g-hero__addr{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:16px;font-family:var(--cop);font-weight:400;font-size:22px;letter-spacing:.02em;color:var(--ink)}
.g-hero__divider{width:100%;display:flex;justify-content:flex-end;padding:24px 16px 16px}
.g-hero__divider i{display:block;width:72px;height:1px;background:var(--divider)}
/* Hours — FbEzmel 18 verbatim; RTL row so א'-ה' reads first from the right (Figma order) */
.g-hero__hours{display:flex;align-items:center;gap:10px;direction:rtl;font-weight:400;font-size:18px;line-height:1.2;color:var(--ink)}
.g-hero__img{flex:0 0 204.34px}
.g-hero__img picture{display:contents}
.g-hero__img img{width:204.34px;height:309px;object-fit:cover}

/* ============================================================
   GALLERY EXHIBITIONS — data-driven cards (Figma 1473:360:
   centered wrap grid, gap 64/16, card 394×592, scrim + date +
   Solway title overlay). Hidden until the renderer finds items.
   ============================================================ */
.g-ex{padding:64px var(--pad-x);background:var(--white);display:flex;flex-direction:column;align-items:center;gap:24px}
.g-ex[hidden]{display:none}
.g-sec-head{width:100%;max-width:var(--max);font-family:var(--cop);font-weight:300;font-size:22px;letter-spacing:.02em;color:var(--ink);text-align:left}
.g-ex__grid{width:100%;max-width:var(--max);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;column-gap:16px;row-gap:64px;direction:rtl}
.gx-card{position:relative;width:394px;height:592px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:16px;isolation:isolate;background:#000}
/* picture-upgrade.js wraps the <img> in <picture> at runtime — style both states */
.gx-card>picture,.gx-card>img{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.gx-card picture img{position:static;width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.gx-card>img{object-fit:cover;transition:transform .6s ease}
.gx-card:hover img{transform:scale(1.04)}
.gx-card::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(102,102,102,.2) 0%,rgba(0,0,0,.8) 81%);pointer-events:none}
/* direction:ltr — הגריד rtl (החדשה מימין, כמו מדינה) ובלעדיו ה-"?" של how-many קופץ לראש השורה */
.gx-ov{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;text-align:center;max-width:100%;direction:ltr}
/* Date — Copperplate Bold 28 Figma → 22 optical; LTR so it reads start → end */
.gx-date{font-family:var(--cop);font-weight:700;font-size:22px;letter-spacing:.02em;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
/* Exhibition title — Solway = the same font as Figma ⇒ 26px verbatim (site exception, exhibition-overlay convention) */
.gx-ttl{display:block;font-family:var(--sol);font-weight:300;font-size:26px;line-height:31px;max-width:313px;text-wrap:balance}

/* Residency banner card — sumii (Figma 1546:3894 desktop / 1555:120 mobile): bottom-up solid
   scrim (desktop only), 5-row centered lockup, → sponsors/sumii/. Dates verbatim from Figma
   ("05.10.2026 - 31.08.2026" — end-first in both frames; sibling card is start-first — designer's). */
.gx-card--res::after{background:linear-gradient(0deg,#000 0%,rgba(0,0,0,0) 100%)}
.gx-ov--res{gap:6.4px;direction:ltr}
.gx-res-ttl{font-family:var(--cop);font-weight:300;font-size:13px;letter-spacing:.04em;margin-bottom:16px}
.gx-res-g{font-family:var(--cop);font-weight:300;font-size:19px;line-height:1.35;letter-spacing:.02em}
.gx-res-g .ls1{letter-spacing:.1em}
.gx-res-x{font-family:var(--cop);font-weight:300;font-size:28.8px;line-height:1}
.gx-res-logo{width:70.38px;height:32px;display:block;color:#fff;margin-top:2px}

/* ============================================================
   THE ARTWORKS — shared .tri triptych (components/triptych-gallery),
   3 interior photos. Figma 1473:394: center 481×841, peeks 302×528
   at opacity .6, no dots/arrows (swipe / peek-click / keyboard).
   ============================================================ */
.g-art{padding:64px var(--pad-x);background:var(--white);display:flex;flex-direction:column;align-items:center;gap:16px}
.g-art .tri{--tri-max-w:var(--max);--tri-aspect:auto;--tri-center-w:481px;--tri-center-h:841px;--tri-peek-w:302px;--tri-peek-h:528px;--tri-peek-left:calc(50% - 473px);--tri-peek-right:calc(50% + 473px);--tri-peek-opacity:.6;--tri-peek-opacity-hover:.85;--tri-bg:var(--white);width:100%}
.g-art .tri-frame{aspect-ratio:auto;height:841px}
.g-art .tri-dots{display:none}
.g-art .tri-slide{object-fit:contain;background:#F9F9F9}
.g-art .tri-caption{font-family:var(--cop);font-weight:300;font-size:16px;color:#989898;direction:ltr;text-align:center;padding:0 16px}
.g-art .tri-caption a{color:inherit;text-decoration:none;transition:opacity .2s}
.g-art .tri-caption a:hover{opacity:.65}

/* ============================================================
   THE GALLERY MANAGER — name column + portrait (Figma 1473:404;
   the fixed-1440 inner container overflows its 1248 parent by 96
   each side, so its 96px padding lands the content back on the
   normal 96px page inset — i.e., full --max width, measured on the
   frame render)
   ============================================================ */
.g-mgr{padding:64px var(--pad-x);background:var(--white);display:flex;flex-direction:column;align-items:center;gap:16px}
.g-mgr__inner{width:100%;max-width:var(--max);padding:48px 0 32px;display:flex;align-items:center;gap:48px}
.g-mgr__info{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;padding:0 16px}
/* natalie Bold / Zigel Light — Copperplate 80 Figma → 64 optical (artist-talk-family precedent) */
.g-mgr__names{display:flex;flex-direction:column;align-items:center;gap:20px}
.g-mgr__names .fn{font-family:var(--cop);font-weight:700;font-size:64px;line-height:1.1;letter-spacing:.02em;text-align:center}
.g-mgr__names .ln{font-family:var(--cop);font-weight:300;font-size:64px;line-height:1.1;letter-spacing:.02em;text-align:center}
/* email — Copperplate 28 Figma → 22 optical; UPPERCASE display (golden rule 3), real mailto value */
.g-mgr__email a{font-family:var(--cop);font-weight:300;font-size:22px;letter-spacing:.02em;transition:opacity .2s}
.g-mgr__email a:hover{opacity:.65}
.g-mgr__pic{flex:0 0 492px;display:flex;justify-content:flex-end}
/* 492×744 box, photo 492×652 vertically centered (46px air above/below — Figma y:46) */
.g-mgr__pic .ph{width:492px;aspect-ratio:492/744;display:flex;align-items:center}
.g-mgr__pic .ph picture{display:contents}
.g-mgr__pic .ph img{width:100%;height:87.634%;object-fit:cover}

/* ============================================================
   RESPONSIVE — TABLET (≤1100)
   ============================================================ */
@media (max-width:1100px){
  :root{--pad-x:48px}
  .g-hero__title{font-size:64px}
  .g-art .tri{--tri-center-w:380px;--tri-center-h:665px;--tri-peek-w:239px;--tri-peek-h:418px;--tri-peek-left:calc(50% - 374px);--tri-peek-right:calc(50% + 374px)}
  .g-art .tri-frame{height:665px}
  .g-mgr__inner{padding:32px 0 24px}
  .g-mgr__names .fn,.g-mgr__names .ln{font-size:48px}
  .g-mgr__pic{flex:0 0 380px}
  .g-mgr__pic .ph{width:380px}
}

/* ============================================================
   RESPONSIVE — MOBILE (≤768) — per Figma 1473:447 (not a shrunk
   desktop): full-bleed hero photo first on white, centered info
   block, 177×214.55 exhibition cards, edge-bleeding tri peeks,
   portrait-first manager block.
   ============================================================ */
@media (max-width:768px){
  :root{--pad-x:16px}

  /* HERO — image full-bleed 390×520 on top, then white info block (Figma 1473:469) */
  .g-hero{background:var(--white);padding:0}
  .g-hero__inner{flex-direction:column-reverse;gap:0;max-width:none}
  .g-hero__img{flex:none;width:100%}
  .g-hero__img img{width:100%;height:520px;object-fit:cover}
  .g-hero__text{width:100%;align-items:center;padding:32px 16px 0}
  .g-hero__title{font-size:32px;text-align:center}
  .g-hero__addr{justify-content:center;flex-wrap:wrap;font-size:13px}
  .g-hero__divider{display:none}
  .g-hero__hours{margin-top:16px;justify-content:center;flex-wrap:wrap;font-weight:300;font-size:16px}

  /* section rhythm — Figma main column gap 48 */
  .g-ex{padding:48px 16px 0;gap:16px}
  .g-art{padding:48px 16px 0;gap:16px}
  .g-mgr{padding:48px 16px;gap:16px}
  .g-sec-head{font-size:16px}

  /* exhibition cards — 177×214.55 (homepage .ex-now geometry), scrim starts transparent.
     column-gap 4 = Figma 1473:509 (177+4+177=358; היה 8 — שני כרטיסים גלשו לשתי שורות) */
  .g-ex__grid{column-gap:4px;row-gap:8px}
  .gx-card{width:177px;height:214.55px;padding:8px}
  .gx-card::after{background:linear-gradient(180deg,rgba(102,102,102,0) 0%,rgba(0,0,0,.8) 81%)}
  .gx-ov{gap:3.757px}
  .gx-date{font-size:10.5px;letter-spacing:.01em}
  .gx-ttl{font-size:12px;line-height:14.56px;max-width:147px}

  /* residency card — mobile: standard scrim, tighter lockup (Figma 1555:120) */
  .gx-card--res::after{background:linear-gradient(180deg,rgba(102,102,102,0) 0%,rgba(0,0,0,.8) 81%)}
  .gx-ov--res{gap:4px}
  .gx-res-ttl{font-size:10px;margin-bottom:0}
  .gx-res-g{font-size:9.5px}
  .gx-res-x{font-size:16px}
  .gx-res-logo{width:47px;height:21.37px}

  /* triptych — center 216×378, peeks 117×204.75 bleeding past the viewport edges (Figma 1473:550) */
  .g-art .tri{width:calc(100% + 32px);margin:0 -16px;--tri-center-w:216px;--tri-center-h:378px;--tri-peek-w:117px;--tri-peek-h:204.75px;--tri-peek-left:calc(50% - 194.5px);--tri-peek-right:calc(50% + 194.5px)}
  .g-art .tri-frame{height:443px}

  /* manager — portrait first (358×448 cover), centered name block (Figma 1473:564) */
  .g-mgr__inner{flex-direction:column-reverse;align-items:stretch;gap:16px;padding:0}
  .g-mgr__pic{flex:none;width:100%;justify-content:center}
  .g-mgr__pic .ph{width:100%;aspect-ratio:358/448;display:block}
  .g-mgr__pic .ph img{width:100%;height:100%;object-fit:cover}
  .g-mgr__info{padding:8px 0 0;gap:8px}
  .g-mgr__names{gap:8px}
  .g-mgr__names .fn{font-size:26px;line-height:1.15}
  .g-mgr__names .ln{font-size:26px;line-height:1.15;font-weight:400}
  .g-mgr__email a{font-size:13px}
}
</style>

<script>
(function(){
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

  /* ---------- gallery info (name / address / hours / manager) — data/galleries.json ---------- */
  async function loadJson(path, embeddedId){
    try{
      var res = await fetch(path, {cache:'no-store'});
      if(res.ok) return await res.json();
    }catch(_){}
    var el = document.getElementById(embeddedId);
    if(el) return JSON.parse(el.textContent);
    throw new Error('cannot load ' + path);
  }
  (async function(){
    try{
      var doc = await loadJson('../../data/galleries.json', 'fallback-galleries');
      var g = (doc.galleries || []).find(function(x){ return x.slug === 'dizengoff'; });
      if(!g) return;

      document.getElementById('g-title').textContent = g.name_he || '';

      var addr = document.getElementById('g-addr');
      var parts = [g.address_street_en, g.address_area_en].filter(Boolean);
      addr.innerHTML = parts.map(function(p){ return '<span>'+esc(p)+'</span>'; }).join('<i class="sq" aria-hidden="true"></i>');

      var hoursEl = document.getElementById('g-hours');
      hoursEl.innerHTML = (g.hours || []).map(function(h){
        return '<span>'+esc(h.days_he + (h.time ? ' ' + h.time : ''))+'</span>';
      }).join('<i class="sq" aria-hidden="true"></i>');

      var m = g.manager;
      var mgrSec = document.getElementById('g-mgr');
      if(!m){ if(mgrSec) mgrSec.hidden = true; return; }
      document.getElementById('mgr-fn').textContent = m.name_en_first || '';
      document.getElementById('mgr-ln').textContent = m.name_en_last || '';
      var em = document.getElementById('mgr-email');
      if(m.email){ em.textContent = m.email; em.href = 'mailto:' + String(m.email).toLowerCase(); }
      else if(em){ em.parentElement.hidden = true; }
      if(m.portrait && m.portrait.alt_he) document.getElementById('mgr-img').alt = m.portrait.alt_he;
      /* portrait src stays the static baked path — swapping src under srcset does nothing (lesson 2026-07-09) */
    }catch(e){}
  })();

  /* ---------- gallery exhibitions — inline slice of exhibitions.json (events-index pattern) ---------- */
  (function(){
    var sec = document.getElementById('g-ex'), grid = document.getElementById('g-ex-grid'), src = document.getElementById('g-exhibitions-data');
    if(!sec || !grid || !src) return;
    var items; try{ items = JSON.parse(src.textContent); }catch(e){ return; }
    /* shows all of this gallery's exhibitions (current + archived) — aligned with the medina page,
       so the card outlives its end_date the way medina keeps loneliness */
    items = items.filter(function(x){
      return x.gallery_id === 'dizengoff';
    }).sort(function(a,b){
      var A = String(a.start_date || ''), B = String(b.start_date || '');
      return A < B ? 1 : A > B ? -1 : 0; /* newest first */
    });
    if(!items.length) return; /* no exhibitions — section stays hidden */
    function d(iso){ var p = String(iso).split('-'); return p[2] + '.' + p[1] + '.' + p[0]; }
    grid.innerHTML = items.map(function(x){
      var img = '<img src="../../'+esc(x.img)+'" width="'+(+x.w||0)+'" height="'+(+x.h||0)+'" alt="'+esc(x.alt||x.title_en||'')+'" loading="lazy" decoding="async">';
      /* residency banner card (sumii) — own anatomy + route to the sponsor page (Figma 1546:3894 / 1555:120) */
      if(x.kind === 'residency'){
        return '<a class="gx-card gx-card--res" href="../../'+esc(x.route)+'">'
          + img
          + '<span class="gx-ov gx-ov--res">'
          +   '<span class="gx-res-ttl">'+esc(x.title_en||'')+'</span>'
          +   '<span class="gx-date">'+esc(x.dates_text||'')+'</span>'
          +   '<span class="gx-res-g"><span class="ls1">the art gallery by</span><br>erez zielinski &amp; rozen</span>'
          +   '<span class="gx-res-x">X</span>'
          +   '<svg class="gx-res-logo" viewBox="0 0 88 40" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="sumii"><use href="#sumii-mark"/></svg>'
          + '</span></a>';
      }
      var dates = (x.start_date && x.end_date)
        ? '<span class="gx-date">'+esc(d(x.start_date) + ' - ' + d(x.end_date))+'</span>'
        : '';
      return '<a class="gx-card" href="../../exhibitions/'+esc(x.slug)+'/">'
        + img
        + '<span class="gx-ov">'+dates+'<span class="gx-ttl">'+esc(x.title_en||'')+'</span></span>'
        + '</a>';
    }).join('');
    sec.hidden = false;
    if(window.PictureUpgrade) PictureUpgrade.refresh(grid);
  })();
})();
</script>

<script>
/* THE ARTWORKS — all works shown at this gallery, from the #g-artworks-data slice of
   data/works.json (filtered by gallery_slug; user decision 2026-08-12 replacing the
   Figma interior photos with the actual artworks). Slides hydrate lazily around the
   current index so a big catalogue doesn't download at once. */
(function(){
  var src = document.getElementById('g-artworks-data');
  var tri = document.querySelector('.g-art .tri');
  var frame = document.querySelector('.g-art .tri-frame');
  if(!src || !tri || !frame) return;
  var items; try{ items = JSON.parse(src.textContent); }catch(e){ return; }
  if(!items.length){ var sec = document.querySelector('.g-art'); if(sec) sec.hidden = true; return; }
  var base = '../../images/works/v2/';
  function srcsetOf(w){
    return (w.widths || []).map(function(width, i){
      var last = i === w.widths.length - 1;
      return (last ? (base + w.img + '.webp') : (base + w.img + '-' + width + 'w.webp')) + ' ' + width + 'w';
    }).join(', ');
  }
  var slides = items.map(function(w){
    var img = document.createElement('img');
    img.className = 'tri-slide';
    img.width = +w.w || 0; img.height = +w.h || 0;
    img.alt = [w.title_he || w.title_en || '', w.artist_he || w.artist_en || ''].filter(Boolean).join(' — ');
    img.loading = 'lazy'; img.decoding = 'async'; img.draggable = false;
    if(w.artist_en) img.dataset.caption = w.artist_en;
    if(w.artist_slug) img.dataset.captionHref = '../../artists/' + w.artist_slug + '/';
    img.dataset.artistHref = '../../works/' + w.id + '/';
    img.dataset.src = base + w.img + '.webp';
    var ss = srcsetOf(w);
    if(ss) img.dataset.srcset = ss;
    frame.appendChild(img);
    return img;
  });
  function hydrate(i){
    var s = slides[(i % slides.length + slides.length) % slides.length];
    if(!s || !s.dataset.src) return;
    if(s.dataset.srcset){ s.setAttribute('srcset', s.dataset.srcset); s.setAttribute('sizes', '(max-width:768px) 216px, 481px'); }
    s.src = s.dataset.src;
    delete s.dataset.src; delete s.dataset.srcset;
  }
  function around(i){ for(var k = -2; k <= 2; k++) hydrate(i + k); }
  around(0);
  tri.addEventListener('tri:change', function(e){ around(e.detail.index); });
})();
</script>
